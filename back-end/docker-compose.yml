
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: personal-trainer-pgdb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: gestao_objetivos
    ports:
      - "5435:5432"
      
    volumes:
      - ./.pgdata:/var/lib/postgresql/data

    restart: always

volumes:
  .pgdata: